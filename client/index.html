<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game — ระบบเก็บข้อมูลตอบคำถาม</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1 class="app-logo">⚡ Quiz Master</h1>
            <p class="app-subtitle">ระบบตอบคำถาม Real-time — เก็บข้อมูล + ยินดีกับ 3 คนแรก</p>
        </header>

        <div id="alertBox" class="alert"></div>

        <div class="tabs">
            <button id="tabJoinBtn" class="tab-btn active" onclick="switchTab('join')">📱 เข้าร่วมเล่น</button>
            <button id="tabCreateBtn" class="tab-btn" onclick="switchTab('create')">🖥️ สร้างห้อง (Host)</button>
        </div>

        <!-- 1. Join Game View -->
        <div id="joinView">
            <form id="joinForm" onsubmit="handleJoinGame(event)">
                <div class="form-group">
                    <label for="gamePin">Game PIN (เลข 6 หลัก)</label>
                    <input type="text" id="gamePin" class="form-input pin-input" maxlength="6" placeholder="000000" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="nickname">ชื่อเล่นของคุณ (2-20 ตัวอักษร)</label>
                    <input type="text" id="nickname" class="form-input" placeholder="ใส่ชื่อเล่น..." maxlength="20" required autocomplete="off">
                </div>
                <button type="submit" class="btn-primary">🚀 เข้าร่วมเกม</button>
            </form>
        </div>

        <!-- 2. Create Poll View -->
        <div id="createView" style="display: none;">
            <!-- Template Selection Box -->
            <div class="question-card" style="background: rgba(70, 23, 143, 0.35); border: 1px solid rgba(255, 182, 193, 0.35); margin-bottom: 24px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 style="font-size: 1.1rem; color: #ffb7c5;">📂 เลือก Quiz Template ที่บันทึกไว้</h3>
                    <button type="button" onclick="loadTemplates()" class="btn-remove-q" style="background: rgba(1, 205, 254, 0.2); border-color: #01cdfe; color: #01cdfe;">🔄 โหลดใหม่</button>
                </div>
                <div id="templateList" style="display: flex; flex-direction: column; gap: 10px; max-height: 200px; overflow-y: auto;">
                    <p style="color: var(--text-muted); font-size: 0.9rem;">กำลังโหลด Template...</p>
                </div>
            </div>

            <form id="createQuizForm" onsubmit="handleCreateQuiz(event)">
                <div class="form-group">
                    <label for="quizTitle">ชื่อหัวข้อ</label>
                    <input type="text" id="quizTitle" class="form-input" placeholder="เช่น คุณชอบสีอะไรมากที่สุด?" required>
                </div>

                <div class="form-group">
                    <label for="quizDesc">รายละเอียด (ถ้ามี)</label>
                    <input type="text" id="quizDesc" class="form-input" placeholder="คำอธิบายเพิ่มเติม...">
                </div>

                <div class="form-group">
                    <label for="hostPassword">🔐 Host Password</label>
                    <input type="password" id="hostPassword" class="form-input" placeholder="อย่างน้อย 4 ตัวอักษร..." required minlength="4">
                </div>

                <div class="form-group">
                    <label for="timeLimit">เวลาตอบ (วินาที)</label>
                    <input type="number" id="timeLimit" class="form-input" value="20" min="5" max="120" required>
                </div>

                <hr style="border-color: rgba(255,255,255,0.1); margin: 24px 0;">
                
                <h3 style="margin-bottom: 16px;">📋 คำถามและตัวเลือก</h3>

                <div class="question-card">
                    <div class="form-group">
                        <label>คำถาม</label>
                        <input type="text" id="questionText" class="form-input" placeholder="เช่น คุณชอบสีอะไรมากที่สุด?" required>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px;">
                        <input type="text" id="optA" class="form-input" placeholder="🔴 ตัวเลือก A" required style="border-left: 4px solid var(--color-red);">
                        <input type="text" id="optB" class="form-input" placeholder="🔵 ตัวเลือก B" required style="border-left: 4px solid var(--color-blue);">
                        <input type="text" id="optC" class="form-input" placeholder="🟡 ตัวเลือก C" required style="border-left: 4px solid var(--color-yellow);">
                    </div>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">💡 ไม่มีคำตอบถูก/ผิด — ระบบเก็บข้อมูลที่ทุกคนเลือก + ยินดีกับ 3 คนที่ตอบเร็วที่สุด</p>
                </div>

                <button type="submit" class="btn-primary btn-success" style="margin-top: 16px;">🎮 สร้างห้องเกมและเป็น Host</button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/sakura.js"></script>
    <script>
        let availableTemplates = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadTemplates();
        });

        function switchTab(tab) {
            document.getElementById('tabJoinBtn').classList.toggle('active', tab === 'join');
            document.getElementById('tabCreateBtn').classList.toggle('active', tab === 'create');
            document.getElementById('joinView').style.display = tab === 'join' ? 'block' : 'none';
            document.getElementById('createView').style.display = tab === 'create' ? 'block' : 'none';
            if (tab === 'create') loadTemplates();
        }

        async function loadTemplates() {
            const listEl = document.getElementById('templateList');
            if (!listEl) return;
            listEl.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">กำลังโหลด Template...</p>';
            
            try {
                const res = await fetch(`${CONFIG.BACKEND_URL}/api/templates`);
                const data = await res.json();
                let templates = data.templates || [];

                const localTemplates = JSON.parse(localStorage.getItem('quiz_templates') || '[]');
                
                const allTemplates = [...templates];
                localTemplates.forEach(lt => {
                    if (!allTemplates.some(t => t.id === lt.id || t.title === lt.title)) {
                        allTemplates.push(lt);
                    }
                });

                availableTemplates = allTemplates;

                if (allTemplates.length === 0) {
                    listEl.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">ยังไม่มี Template ที่บันทึกไว้ (คุณสามารถกดบันทึกเป็น Template ในหน้าสรุปผลหลังเล่นจบได้)</p>';
                    return;
                }

                listEl.innerHTML = '';
                allTemplates.forEach((t, idx) => {
                    const item = document.createElement('div');
                    item.style.cssText = 'background: rgba(0,0,0,0.3); padding: 12px 16px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.1);';
                    item.innerHTML = `
                        <div>
                            <strong style="color: #05ffa1; font-size: 1.05rem;">${t.title}</strong>
                            <div style="font-size: 0.85rem; color: var(--text-muted);">${t.question_text || ''} (${t.time_limit_seconds || 20} วินาที)</div>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button type="button" onclick="applyTemplate(${idx})" style="background: #1368ce; color: white; border: none; padding: 6px 14px; border-radius: 8px; font-weight: 700; cursor: pointer;">✨ ใช้</button>
                            <button type="button" onclick="deleteTemplate('${t.id}', ${idx})" style="background: rgba(226,27,60,0.3); color: #ff99a8; border: 1px solid #e21b3c; padding: 6px 10px; border-radius: 8px; cursor: pointer;">🗑️</button>
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            } catch (err) {
                console.error('Failed to load templates:', err);
                listEl.innerHTML = '<p style="color: #ff99a8; font-size: 0.9rem;">ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์เพื่อดึง Template ได้</p>';
            }
        }

        function applyTemplate(index) {
            const t = availableTemplates[index];
            if (!t) return;
            
            document.getElementById('quizTitle').value = t.title || '';
            document.getElementById('quizDesc').value = t.description || '';
            document.getElementById('timeLimit').value = t.time_limit_seconds || 20;
            document.getElementById('questionText').value = t.question_text || '';
            document.getElementById('option_a' in t ? 'optA' : 'optA').value = t.option_a || '';
            document.getElementById('optB').value = t.option_b || '';
            document.getElementById('optC').value = t.option_c || '';

            showAlert('✨ ดึงข้อมูลจาก Template เรียบร้อยแล้ว!', 'success');
        }

        async function deleteTemplate(id, index) {
            if (!confirm('คุณต้องการลบ Template นี้หรือไม่?')) return;

            try {
                await fetch(`${CONFIG.BACKEND_URL}/api/templates/${id}`, { method: 'DELETE' });
            } catch (err) {
                console.warn('API delete failed, removing locally');
            }

            let localTemplates = JSON.parse(localStorage.getItem('quiz_templates') || '[]');
            localTemplates = localTemplates.filter(t => t.id !== id);
            localStorage.setItem('quiz_templates', JSON.stringify(localTemplates));

            loadTemplates();
            showAlert('ลบ Template เรียบร้อยแล้ว', 'warning');
        }

        function showAlert(msg, type = 'danger') {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert alert-${type}`;
            alertBox.innerText = msg;
            alertBox.style.display = 'block';
            setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
        }

        function handleJoinGame(e) {
            e.preventDefault();
            const pin = document.getElementById('gamePin').value.trim();
            const nickname = document.getElementById('nickname').value.trim();

            if (!/^\d{6}$/.test(pin)) return showAlert('Game PIN ต้องเป็นตัวเลข 6 หลัก');
            if (nickname.length < 2 || nickname.length > 20) return showAlert('ชื่อเล่นต้องมี 2-20 ตัวอักษร');

            sessionStorage.setItem('join_pin', pin);
            sessionStorage.setItem('join_nickname', nickname);
            window.location.href = `play.html?pin=${pin}`;
        }

        function handleCreateQuiz(e) {
            e.preventDefault();

            const quizData = {
                title: document.getElementById('quizTitle').value.trim(),
                description: document.getElementById('quizDesc').value.trim(),
                time_limit_seconds: parseInt(document.getElementById('timeLimit').value),
                question: {
                    question_text: document.getElementById('questionText').value.trim(),
                    option_a: document.getElementById('optA').value.trim(),
                    option_b: document.getElementById('optB').value.trim(),
                    option_c: document.getElementById('optC').value.trim()
                }
            };

            if (!quizData.question.option_a || !quizData.question.option_b || !quizData.question.option_c) {
                return showAlert('กรุณากรอกตัวเลือกให้ครบทั้ง 3 ช่อง');
            }

            sessionStorage.setItem('pending_quiz', JSON.stringify(quizData));
            sessionStorage.setItem('host_password', document.getElementById('hostPassword').value.trim());
            window.location.href = 'host.html';
        }
    </script>
</body>
</html>
